[Server]
; Hostname or IP address, just leave empty to use the game server host adress from the game's
; .exe file, which defaults back to the original ps2nfs04.ea.com (unless the file is patched
; with something else).
Host = nfs.onl

[EATrax]
; Change to 1 to remove quotes from titles
NoQuotes = 0
; Open NFSUServerChangerTrax.csv with LibreOffice, Notepad or similar to edit. Semicolon is
; delimiter.
; 1st col: either r (Race), m (Menu), a (All), or x (Off) as default,
; 2nd col is title,
; 3rd is artist and 4th is album
; To disable trax renamer feature: delete or rename .csv file

[HolePunch]
; Races also work when the host can't forward port 3658 (mobile internet, no port forwarding):
; on servers that support it, the players' real ports are exchanged, or the race goes through
; the server. 1 = write NFSUServerChanger_HolePunch.log next to the .asi (to find connection
; problems).
Log = 0

[PublicList]
; Used by the launcher (NFSUServerChanger.exe), ignored by the plugin.
; Trackers listing public servers: Name = hostname (-> http://<host>/tracker/get_list.php)
; or full URL.
HarpyWar = nfsug.harpywar.com
NFS.onl = nfs.onl

[FixedServers]
; Used by the launcher (NFSUServerChanger.exe), ignored by the plugin.
; Fixed public servers, always queried and listed while online: Name = hostname or IP.
; (Your own servers that should show even when offline go into servers.dat next to the launcher.)
kickRom Speedway = nfs.onl
NFSU.online FreeConnect = nfsu.online
PlayStation 2 Online = ps2online.com
pLan REVIVE = zerolan.ru
EA Nation Server = eahub.eu

[Settings]
; Used by the launcher (NFSUServerChanger.exe), ignored by the plugin.
; Also editable in the launcher (menu > Settings).
; Editor for the Edit menu entries: a command, {file} = the file
; (appended at the end if missing). Empty = default text editor
; (Windows: Notepad, Linux: the desktop's text editor).
Editor = 
; Public server lists to query: names from [PublicList], comma-separated.
PublicLists = HarpyWar, NFS.onl
; Launcher language (menu > Language): de, fr, ..., en = English. More languages can be
; downloaded there. Empty = the system language (English if it isn't installed).
Language = 

[Launch]
; Used by the launcher (NFSUServerChanger.exe), ignored by the plugin.
; Custom command to start the game, {exe} = the selected speed*.exe
; (appended at the end if missing).
; Empty = default
; (Windows: start directly, Linux: wine or Lutris' wine, WINEPREFIX detected from the path).
; Examples: WINEPREFIX=~/Games/nfsu wine   or   gamemoderun wine   or   wine {exe} -window
Command =
; The speed*.exe started last time (set by the launcher).
Game =

[Community]
; Used by the launcher (NFSUServerChanger.exe), ignored by the plugin.
; Links in the launcher's Community menu: Name = URL, in this order.
Retro Racing Point = https://discord.gg/JMaypEd
Multiplayer & Hot Laps = https://nfs.onl/
pLan REVIVE = http://zerolan.ru/
Russian Community = https://discord.gg/nbeV5Q4
Online Server Monitoring = https://nfsu.online/
PlayStation 2 Online = https://discord.gg/zE79nWT
EA Nation Hub = https://discord.gg/C8SNj8xeut

[Help]
; Used by the launcher (NFSUServerChanger.exe), ignored by the plugin.
; Links in the launcher's Help menu: Name = URL, in this order.
Tutorial (NFS.onl Wiki) = https://wiki.nfs.onl/doku.php?id=tutorials:serverchanger
Documentation (GitHub) = https://github.com/Pelorojo/NFSUServerChanger/blob/master/launcher/README.md
